name: Build Windows Light

on:
  push:
    branches: [main]
    paths:
      - build.ps1
      - scripts/**
      - tests/**
      - .github/workflows/build.yml
  pull_request:
    paths:
      - build.ps1
      - scripts/**
      - tests/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream stable tag; blank = latest release, main = nightly'
        type: string
        required: false
      validate_only:
        description: 'Build and check artifacts without publishing a Release'
        type: boolean
        default: true
  schedule:
    - cron: '23 3 * * *' # 11:23 Asia/Shanghai: latest stable
    - cron: '0 16 * * *' # 00:00 Asia/Shanghai: nightly

permissions:
  contents: read

concurrency:
  group: windows-light-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      date: ${{ steps.source.outputs.date }}
      tag: ${{ steps.source.outputs.tag }}
      nightly: ${{ steps.source.outputs.nightly }}
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - name: Select upstream source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SCHEDULE: ${{ github.event.schedule }}
          VALIDATE_ONLY: ${{ github.event_name == 'pull_request' || inputs.validate_only || github.ref != 'refs/heads/main' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:REQUESTED_VERSION
          if ($env:SCHEDULE -eq '0 16 * * *') { $version = 'main' }
          # Temporary stable-release PR validation; restore main after validation.
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $version = 'v0.23.1' }
          $date = [DateTime]::UtcNow.AddHours(8).ToString('yyyyMMdd')
          $nightly = $version -eq 'main'
          if ($nightly) {
            $commit = gh api repos/NousResearch/hermes-agent/commits/main --jq .sha
            if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve upstream main.' }
            $tag = "light-nightly-$date-$($commit.Substring(0,12))"
          } else {
            if (-not $version) {
              $version = gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve latest upstream release.' }
            }
            if ($version -notmatch '^v[0-9]+(?:\.[0-9]+){1,3}$') { throw 'Expected a stable numeric tag or main.' }
            $release = gh api "repos/NousResearch/hermes-agent/releases/tags/$version" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease) { throw 'Expected a published stable release.' }
            $commit = gh api "repos/NousResearch/hermes-agent/commits/$version" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve upstream tag.' }
            $tag = "light-$version"
          }
          $needed = 'true'
          if ($env:VALIDATE_ONLY -ne 'true') {
            try {
              $existing = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers @{Authorization="Bearer $env:GH_TOKEN"}
              if ($existing.draft) { throw 'An unfinished draft exists. Review it before retrying.' }
              $needed = 'false'
            } catch {
              if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
            }
          }
          "version=$version", "commit=$commit", "date=$(if ($nightly) { $date })", "tag=$tag", "nightly=$($nightly.ToString().ToLowerInvariant())", "needed=$needed" >> $env:GITHUB_OUTPUT
          "Upstream: $version @ $commit; release: $tag; build needed: $needed" >> $env:GITHUB_STEP_SUMMARY

  build:
    needs: select
    if: needs.select.outputs.needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test toolchain and build contracts
        shell: pwsh
        run: |
          ./tests/toolchain.Tests.ps1
          ./tests/build.Tests.ps1
      - name: Read toolchain from the selected upstream SHA
        id: toolchain
        shell: pwsh
        env:
          UPSTREAM_COMMIT: ${{ needs.select.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/toolchain.ps1
          if ($env:UPSTREAM_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Expected a full upstream SHA.' }
          $lockPath = Join-Path $env:RUNNER_TEMP 'upstream-pm-lock.json'
          # Authenticated contents API avoids anonymous raw-host throttling.
          # PowerShell honors Retry-After on 429; retries remain bounded.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $file = Invoke-RestMethod "https://api.github.com/repos/NousResearch/hermes-agent/contents/pm/lock.json?ref=$env:UPSTREAM_COMMIT" -Headers $headers -MaximumRetryCount 3 -RetryIntervalSec 10
          if ($file.encoding -ne 'base64' -or -not $file.content) { throw 'Expected base64 content for the selected upstream toolchain lock.' }
          [IO.File]::WriteAllBytes($lockPath, [Convert]::FromBase64String($file.content))
          $pins = Get-UpstreamToolchain $lockPath
          "node=$($pins.node)", "npm=$($pins.npm)", "pnpm=$($pins.pnpm)" >> $env:GITHUB_OUTPUT
          "Selected upstream $env:UPSTREAM_COMMIT; Node $($pins.node); npm $($pins.npm); pnpm $($pins.pnpm); lock SHA256 $($pins.lockSha256)" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          package-manager-cache: false
      - name: Install exact upstream npm
        shell: pwsh
        env:
          NPM_VERSION: ${{ steps.toolchain.outputs.npm }}
        run: |
          npm.cmd install --global "npm@$env:NPM_VERSION" --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install locked npm.' }
      - name: Install exact upstream pnpm when pinned
        if: steps.toolchain.outputs.pnpm != ''
        shell: pwsh
        env:
          PNPM_VERSION: ${{ steps.toolchain.outputs.pnpm }}
        run: |
          npm.cmd install --global "pnpm@$env:PNPM_VERSION" --allow-scripts=pnpm --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install locked pnpm.' }
      - name: Build and package upstream Light
        shell: pwsh
        env:
          UPSTREAM_VERSION: ${{ needs.select.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.select.outputs.commit }}
          NIGHTLY_DATE: ${{ needs.select.outputs.date }}
        run: ./build.ps1 -Version $env:UPSTREAM_VERSION -UpstreamCommit $env:UPSTREAM_COMMIT -NightlyDate $env:NIGHTLY_DATE
      - name: Verify packaged checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checksums = @(Get-ChildItem dist/*.sha256)
          if ($checksums.Count -ne 1) { throw 'Expected one ZIP checksum.' }
          $line = (Get-Content -LiteralPath $checksums[0].FullName -Raw).Trim()
          if ($line -cnotmatch '^([0-9a-f]{64})  ([^/\\]+\.zip)$') { throw 'Invalid checksum manifest.' }
          $expected = $Matches[1]
          $zipPath = Join-Path 'dist' $Matches[2]
          if ((Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected) { throw 'ZIP checksum mismatch.' }
          "Packaged ZIP checksum verified: $expected" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-light
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.validate_only
    needs: [select, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: windows-light
          path: release-files
      - name: Publish Light release
        shell: bash
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          NIGHTLY: ${{ needs.select.outputs.nightly }}
        run: |
          sha256sum --check *.sha256
          printf '%s\n' 'Windows x64 build of the upstream Hermes Light variant. Unofficial distribution; upstream source is unmodified.' '' 'Extract the complete ZIP and run the EXE named in BUILD-INFO.json. Updates use whole-package replacement.' '' 'Build provenance:' > release-notes.md
          cat BUILD-INFO.json >> release-notes.md
          flags=()
          if [[ "$NIGHTLY" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" *.zip *.sha256 BUILD-INFO.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
