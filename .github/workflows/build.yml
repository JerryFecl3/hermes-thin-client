name: Build Windows Light

on:
  push:
    branches: [main]
    paths:
      - build.ps1
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream stable tag; blank = latest release, main = nightly'
        type: string
        required: false
  schedule:
    - cron: '23 3 * * *' # 11:23 Asia/Shanghai: latest stable
    - cron: '0 16 * * *' # 00:00 Asia/Shanghai: nightly

permissions:
  contents: read

concurrency:
  group: windows-light
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      date: ${{ steps.source.outputs.date }}
      tag: ${{ steps.source.outputs.tag }}
      nightly: ${{ steps.source.outputs.nightly }}
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - name: Select upstream source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:REQUESTED_VERSION
          if ($env:SCHEDULE -eq '0 16 * * *') { $version = 'main' }
          $date = [DateTime]::UtcNow.AddHours(8).ToString('yyyyMMdd')
          $nightly = $version -eq 'main'
          if ($nightly) {
            $commit = gh api repos/NousResearch/hermes-agent/commits/main --jq .sha
            if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve upstream main.' }
            $tag = "light-nightly-$date-$($commit.Substring(0,12))"
          } else {
            if (-not $version) {
              $version = gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name
              if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve latest upstream release.' }
            }
            if ($version -notmatch '^v[0-9]+(?:\.[0-9]+){1,3}$') { throw 'Expected a stable numeric tag or main.' }
            $release = gh api "repos/NousResearch/hermes-agent/releases/tags/$version" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $release.draft -or $release.prerelease) { throw 'Expected a published stable release.' }
            $commit = gh api "repos/NousResearch/hermes-agent/commits/$version" --jq .sha
            if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve upstream tag.' }
            $tag = "light-$version"
          }
          $needed = 'true'
          try {
            $existing = Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers @{Authorization="Bearer $env:GH_TOKEN"}
            if ($existing.draft) { throw 'An unfinished draft exists. Review it before retrying.' }
            $needed = 'false'
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "version=$version", "commit=$commit", "date=$(if ($nightly) { $date })", "tag=$tag", "nightly=$($nightly.ToString().ToLowerInvariant())", "needed=$needed" >> $env:GITHUB_OUTPUT
          "Upstream: $version @ $commit; release: $tag; build needed: $needed" >> $env:GITHUB_STEP_SUMMARY

  build:
    needs: select
    if: needs.select.outputs.needed == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and package upstream Light
        shell: pwsh
        env:
          UPSTREAM_VERSION: ${{ needs.select.outputs.version }}
          UPSTREAM_COMMIT: ${{ needs.select.outputs.commit }}
          NIGHTLY_DATE: ${{ needs.select.outputs.date }}
        run: ./build.ps1 -Version $env:UPSTREAM_VERSION -UpstreamCommit $env:UPSTREAM_COMMIT -NightlyDate $env:NIGHTLY_DATE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-light
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [select, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: windows-light
          path: release-files
      - name: Publish Light release
        shell: bash
        working-directory: release-files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
          NIGHTLY: ${{ needs.select.outputs.nightly }}
        run: |
          sha256sum --check *.sha256
          printf '%s\n' 'Windows x64 build of the upstream Hermes Light variant. Unofficial distribution; upstream source is unmodified.' '' 'Extract the complete ZIP and run the EXE named in BUILD-INFO.json. Updates use whole-package replacement.' '' 'Build provenance:' > release-notes.md
          cat BUILD-INFO.json >> release-notes.md
          flags=()
          if [[ "$NIGHTLY" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" *.zip *.sha256 BUILD-INFO.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
